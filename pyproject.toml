[project]
name = "notify-flow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anirudha-D", email = "20cse0031@vvce.ac.in" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "sqlalchemy[asyncio]>=2.1.6",
]

[project.scripts]
notify-flow = "notify_flow:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers>=4.15.0",
]
